name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Valores falsos só para compilar; o build não acessa o Supabase.
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-exemplo
          SUPABASE_SERVICE_ROLE_KEY: chave-de-exemplo

  banco:
    name: Regras do banco (SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Arquivo de instalação está atualizado
        run: |
          bash supabase/gerar-instalar.sh
          git diff --exit-code supabase/instalar.sql
      - name: Migrações e testes
        run: bash supabase/tests/run.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
